# 构建产物 lib/ 入库(GitHub 安装开箱即用,上游惯例)——每次 push 自动重建回写,
# 防止 src/ 前进而 lib/ 停留在旧编译产物(本仓库踩过一次)。
name: build-lib
on:
  push:
    branches: [main]
    paths-ignore:
      - 'lib/**'
      - 'CHANGELOG*.md'
      - 'README*.md'
permissions:
  contents: write
concurrency:
  group: build-lib-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx vitest run
      - name: Verify build output
        run: |
          test -f lib/index.js || { echo "::error::lib/index.js missing"; exit 1; }
          test -f lib/features/qq-send-tools.js || { echo "::error::lib/features/qq-send-tools.js missing (src 有新文件但没产出)"; exit 1; }
          grep -q "registerQqSendTools" lib/gateway/bootstrap.js || { echo "::error::qq_send 没有接线到 bootstrap"; exit 1; }
      - name: Commit lib if changed
        run: |
          git config user.name "lecheng2018"
          git config user.email "41589620+lecheng2018@users.noreply.github.com"
          git add lib
          git diff --cached --quiet || (git commit -m "ci: rebuild lib [skip ci]" && git push)
