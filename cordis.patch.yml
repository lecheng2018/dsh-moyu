# zhoukai-dsh-qqbot bundle patch (fork of tencent-connect/dsh-qqbot)
#
# 当本包通过 `dsh plugin --profile <name> add @zhoukai/dsh-qqbot` 安装后，
# dsh 启动时自动加载此 patch。
#
# 环境变量：
#   QQBOT_APPID  - QQ Bot AppID（必填）
#   QQBOT_SECRET - QQ Bot AppSecret（必填）
#
# 叠加顺序：dsh-base → 本 bundle patch → profile cordis.patch.yml → --patch

# ── 插入 zhoukai-qqbot 插件行 ──
- insert:
    - id: zhoukai-qqbot
      name: '@zhoukai/dsh-qqbot'
      config:
        appId: __FROM_ENV__
        appSecret: __FROM_ENV__
        # provider/model 留空：从宿主默认模型路由继承
        # 用户可通过 /model 命令在聊天中切换
        requireMention: true
        textChunkLimit: 4500
        sessionIdleTimeout: 1800000
        maxQueue: 20
        processingTimeoutMs: 1800000
        historyLimit: 10
        debug: false
